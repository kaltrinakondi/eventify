<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Eventify</title>
  <link rel="stylesheet" href="css/style.css?v=45">
  <link rel="stylesheet" href="css/responsive.css?v=7">
  <script src="js/theme.js"></script>
  <script src="js/auth-gate.js?v=3"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="images/app-icon.png">
  <link rel="apple-touch-icon" href="images/app-icon.png">
  <meta name="theme-color" content="#4b245d">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><span class="logo-icon">E</span> Eventify</a>
    </div>
  </nav>
  <section class="form-section">
    <div class="container">
      <div class="form-card">
        <h2>Reset Password</h2>
        <p class="subtitle">We'll send you a reset link by email</p>
        <div id="form-alert" class="alert hidden"></div>
        <form id="forgot-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Send Reset Link</button>
        </form>
        <div class="form-footer"><a href="login.html">Back to Login</a></div>
      </div>
    </div>
  </section>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/api.js?v=8"></script>
  <script src="js/i18n.js"></script>
  <script src="js/features.js"></script>
  <script src="js/app.js?v=11"></script>
  <script src="js/auth.js"></script>
</body>
</html>
