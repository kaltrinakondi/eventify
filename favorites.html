<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorite Events - Eventify</title>
  <link rel="stylesheet" href="css/style.css?v=43">
  <link rel="stylesheet" href="css/responsive.css?v=7">
  <script src="js/theme.js"></script>
  <script src="js/auth-gate.js?v=3"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="images/app-icon.png">
  <link rel="apple-touch-icon" href="images/app-icon.png">
  <meta name="theme-color" content="#4b245d">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><span class="logo-icon">E</span> Eventify</a>
      <div class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="my-events.html">My Events</a>
        <a href="my-rsvps.html">My RSVPs</a>
        <a href="favorites.html">Favorite Events</a>
        <a href="contact.html">Contact</a>
        <div class="mobile-auth" id="mobile-auth"></div>
      </div>
      <div class="nav-auth" id="nav-auth">
        <a href="login.html" class="btn btn-sm btn-outline">Log In</a>
        <a href="register.html" class="btn btn-sm btn-primary">Sign Up</a>
      </div>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="page-header"><div class="container"><h1>♥ Favorite Events</h1><p>Your favorite events in one place</p></div></div>

  <section class="events-section">
    <div class="container">
      <div id="loading" class="loading"><div class="spinner"></div></div>
      <div class="events-grid" id="fav-grid"></div>
      <div id="empty" class="empty-state hidden"><h3>No favorite events yet</h3><p>Click ♡ on any event to save it here.</p></div>
    </div>
  </section>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/api.js?v=8"></script>
  <script src="js/i18n.js"></script>
  <script src="js/features.js"></script>
  <script src="js/app.js?v=11"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Eventify.init();
      if (!Eventify.requireAuth('favorites.html')) return;
      const data = await EventifyDB.getFavorites(Eventify.currentUser.id);
      document.getElementById('loading').classList.add('hidden');
      if (data.events?.length) {
        const grid = document.getElementById('fav-grid');
        grid.innerHTML = data.events.map(e => Eventify.renderEventCard(e)).join('');
        Eventify.bindFavoriteButtons(grid);
        Eventify.bindRsvpButtons(grid);
      } else document.getElementById('empty').classList.remove('hidden');
    });
  </script>
</body>
</html>
