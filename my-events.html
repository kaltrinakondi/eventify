<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Events - Eventify</title>
  <link rel="stylesheet" href="css/style.css?v=52">
  <link rel="stylesheet" href="css/responsive.css?v=8">
  <script src="js/theme.js"></script>
  <script src="js/auth-gate.js?v=4"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="images/app-icon.png">
  <link rel="apple-touch-icon" href="images/app-icon.png">
  <meta name="theme-color" content="#4b245d">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><span class="logo-icon">E</span> Eventify</a>
      <div class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="my-events.html">My Events</a>
        <a href="my-rsvps.html">My RSVPs</a>
        <a href="favorites.html">Favorite Events</a>
        <a href="contact.html">Contact</a>
        <div class="mobile-auth" id="mobile-auth"></div>
      </div>
      <div class="nav-auth" id="nav-auth">
        <a href="login.html" class="btn btn-sm btn-outline">Log In</a>
        <a href="register.html" class="btn btn-sm btn-primary">Sign Up</a>
      </div>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1>My Events</h1>
      <p>Manage events you've created</p>
      <a href="create-event.html" class="btn btn-primary" style="margin-top:16px;">+ Create New Event</a>
    </div>
  </div>

  <section class="events-section">
    <div class="container">
      <div id="loading" class="loading"><div class="spinner"></div><p>Loading your events...</p></div>
      <div class="events-grid" id="created-events"></div>
      <div id="empty-created" class="empty-state hidden">
        <h3>No events created yet</h3>
        <p><a href="create-event.html">Create your first event</a></p>
      </div>
    </div>
  </section>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/api.js?v=12"></script>
  <script src="js/i18n.js"></script>
  <script src="js/features.js"></script>
  <script src="js/app.js?v=15"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Eventify.init();
      if (!Eventify.requireAuth('my-events.html')) return;

      const data = await EventifyDB.getMyEvents(Eventify.currentUser.id);
      document.getElementById('loading').classList.add('hidden');

      const grid = document.getElementById('created-events');
      if (data.events?.length) {
        grid.innerHTML = data.events.map(e =>
          Eventify.renderEventCard(e, { showRsvp: false, showActions: true, showDelete: true, showFavorite: false })
        ).join('');
        Eventify.bindDeleteButtons(grid);
      } else {
        document.getElementById('empty-created').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
