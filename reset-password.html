<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Password - Eventify</title>
  <link rel="stylesheet" href="css/style.css?v=52">
  <link rel="stylesheet" href="css/responsive.css?v=9">
  <script src="js/theme.js"></script>
  <script src="js/auth-gate.js?v=4"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="images/app-icon.png">
  <link rel="apple-touch-icon" href="images/app-icon.png">
  <meta name="theme-color" content="#4b245d">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><span class="logo-icon">E</span> Eventify</a>
    </div>
  </nav>
  <section class="form-section">
    <div class="container">
      <div class="form-card">
        <h2>Set New Password</h2>
        <p class="subtitle">Enter your new password below</p>
        <div id="form-alert" class="alert hidden"></div>
        <form id="reset-form">
          <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required minlength="6">
          </div>
          <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Update Password</button>
        </form>
      </div>
    </div>
  </section>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/api.js?v=12"></script>
  <script src="js/i18n.js"></script>
  <script src="js/features.js"></script>
  <script src="js/app.js?v=16"></script>
  <script src="js/auth.js"></script>
</body>
</html>
