<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Eventify</title>
  <link rel="stylesheet" href="css/style.css?v=43">
  <link rel="stylesheet" href="css/responsive.css?v=7">
  <script src="js/theme.js"></script>
  <script src="js/auth-gate.js?v=3"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="images/app-icon.png">
  <link rel="apple-touch-icon" href="images/app-icon.png">
  <meta name="theme-color" content="#4b245d">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><span class="logo-icon">E</span> Eventify</a>
      <div class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="index.html#categories">Categories</a>
        <a href="admin.html">Admin</a>
        <a href="contact.html">Contact</a>
        <div class="mobile-auth" id="mobile-auth"></div>
      </div>
      <div class="nav-auth" id="nav-auth">
        <a href="login.html" class="btn btn-sm btn-outline">Log In</a>
        <a href="register.html" class="btn btn-sm btn-primary">Sign Up</a>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1>Admin Dashboard</h1>
      <p>Manage users, events, and view statistics</p>
    </div>
  </div>

  <section class="admin-section">
    <div class="container">
      <div class="stats-grid" id="stats-grid"></div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="users">Users</button>
        <button class="tab-btn" data-tab="events">Events</button>
      </div>

      <div class="tab-content active" id="tab-users">
        <table class="admin-table">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr>
          </thead>
          <tbody id="users-table"></tbody>
        </table>
      </div>

      <div class="tab-content" id="tab-events">
        <table class="admin-table">
          <thead>
            <tr><th>Title</th><th>Category</th><th>Date</th><th>Organizer</th><th>Actions</th></tr>
          </thead>
          <tbody id="events-table"></tbody>
        </table>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom"><p>&copy; 2026 Eventify. All rights reserved.</p></div>
    </div>
  </footer>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/api.js?v=8"></script>
  <script src="js/i18n.js"></script>
  <script src="js/features.js"></script>
  <script src="js/app.js?v=11"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Eventify.init();
      if (!Eventify.currentUser || Eventify.currentUser.role !== 'admin') {
        window.location.href = 'login.html?redirect=admin.html';
        return;
      }

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
        });
      });

      loadDashboard();
    });

    async function loadDashboard() {
      const statsData = await EventifyDB.getAdminStats();
      if (statsData.success) {
        const s = statsData.stats;
        document.getElementById('stats-grid').innerHTML = `
          <div class="stat-card"><div class="stat-value">${s.users}</div><div class="stat-label">Total Users</div></div>
          <div class="stat-card"><div class="stat-value">${s.events}</div><div class="stat-label">Total Events</div></div>
          <div class="stat-card"><div class="stat-value">${s.rsvps}</div><div class="stat-label">Total RSVPs</div></div>
          <div class="stat-card"><div class="stat-value">${s.reviews}</div><div class="stat-label">Reviews</div></div>
          <div class="stat-card"><div class="stat-value">${s.upcoming}</div><div class="stat-label">Upcoming Events</div></div>
        `;
      }

      const usersData = await EventifyDB.getAdminUsers();
      if (usersData.success) {
        document.getElementById('users-table').innerHTML = usersData.users.map(u => `
          <tr>
            <td>${Eventify.escapeHtml(u.name)}</td>
            <td>${Eventify.escapeHtml(u.email)}</td>
            <td><span class="badge badge-${u.role}">${u.role}</span></td>
            <td>${new Date(u.created_at).toLocaleDateString()}</td>
            <td>${u.role !== 'admin' ? `<button class="btn btn-sm btn-danger delete-user" data-id="${u.id}">Delete</button>` : '-'}</td>
          </tr>
        `).join('');

        document.querySelectorAll('.delete-user').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Delete this user?')) return;
            const data = await EventifyDB.deleteUserProfile(btn.dataset.id);
            Eventify.showToast(data.message, data.success ? 'success' : 'error');
            if (data.success) loadDashboard();
          });
        });
      }

      const eventsData = await EventifyDB.getAdminEvents();
      if (eventsData.success) {
        document.getElementById('events-table').innerHTML = eventsData.events.map(e => `
          <tr>
            <td>${Eventify.escapeHtml(e.title)}</td>
            <td>${Eventify.escapeHtml(e.category)}</td>
            <td>${Eventify.formatDate(e.date)}</td>
            <td>${Eventify.escapeHtml(e.organizer_name)}</td>
            <td><button class="btn btn-sm btn-danger delete-event" data-id="${e.id}">Delete</button></td>
          </tr>
        `).join('');

        document.querySelectorAll('.delete-event').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Delete this event?')) return;
            const data = await EventifyDB.deleteEvent(btn.dataset.id);
            Eventify.showToast(data.message, data.success ? 'success' : 'error');
            if (data.success) loadDashboard();
          });
        });
      }
    }
  </script>
</body>
</html>
