<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Eventify</title>
  <link rel="stylesheet" href="css/style.css?v=44">
  <link rel="stylesheet" href="css/responsive.css?v=7">
  <script src="js/theme.js"></script>
  <script src="js/auth-gate.js?v=3"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="images/app-icon.png">
  <link rel="apple-touch-icon" href="images/app-icon.png">
  <meta name="theme-color" content="#4b245d">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="login.html" class="logo"><span class="logo-icon">E</span> Eventify</a>
      <div class="nav-links" id="nav-links">
        <div class="mobile-auth" id="mobile-auth"></div>
      </div>
      <div class="nav-auth" id="nav-auth">
        <a href="login.html" class="btn btn-sm btn-outline">Log In</a>
        <a href="register.html" class="btn btn-sm btn-primary">Sign Up</a>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <section class="form-section">
    <div class="container">
      <div class="form-card">
        <h2>Welcome to Eventify</h2>
        <p class="subtitle">Log in if you already have an account, or create one to continue.</p>
        <div id="form-alert" class="alert hidden"></div>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Log In</button>
        </form>
        <div class="form-footer">
          <a href="register.html" class="btn btn-outline btn-block" style="margin-top:12px;">Don't have an account? Sign Up</a>
          <a href="forgot-password.html" style="display:inline-block;margin-top:12px;">Forgot password?</a>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom"><p>&copy; 2026 Eventify. All rights reserved.</p></div>
    </div>
  </footer>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/api.js?v=8"></script>
  <script src="js/i18n.js"></script>
  <script src="js/features.js"></script>
  <script src="js/app.js?v=11"></script>
  <script src="js/auth.js"></script>
</body>
</html>
