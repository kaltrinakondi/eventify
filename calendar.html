<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - Eventify</title>
  <link rel="stylesheet" href="css/style.css?v=55">
  <link rel="stylesheet" href="css/responsive.css?v=9">
  <script src="js/theme.js"></script>
  <script src="js/auth-gate.js?v=6"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="images/app-icon.png">
  <link rel="apple-touch-icon" href="images/app-icon.png">
  <meta name="theme-color" content="#4b245d">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><span class="logo-icon">E</span> Eventify</a>
      <div class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="index.html#categories">Categories</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <div class="mobile-auth" id="mobile-auth"></div>
      </div>
      <div class="nav-auth" id="nav-auth">
        <a href="login.html" class="btn btn-sm btn-outline">Log In</a>
        <a href="register.html" class="btn btn-sm btn-primary">Sign Up</a>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1>Event Calendar</h1>
      <p>Dates with events are marked — click a date to see them</p>
    </div>
  </div>

  <section class="calendar-section">
    <div class="container">
      <div class="calendar-header">
        <div class="calendar-nav">
          <button id="cal-prev" aria-label="Previous month">‹</button>
          <h2 id="calendar-month"></h2>
          <button id="cal-next" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
      <div class="calendar-events" id="calendar-day-events">
        <p class="empty-state">Select a date to view events</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom"><p>&copy; 2026 Eventify. All rights reserved.</p></div>
    </div>
  </footer>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/api.js?v=21"></script>
  <script src="js/i18n.js"></script>
  <script src="js/features.js"></script>
  <script src="js/app.js?v=21"></script>
  <script src="js/calendar.js?v=3"></script>
</body>
</html>
